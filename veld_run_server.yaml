x-veld:
  code:
    description: "This is a veldified version of postgres, based on 
      https://github.com/SteffRhes/postgres_rooted ."
    topic:
      - "SQL"
      - "relational database"

    input:
      - volume: /veld/input/config/
        file_type: "conf"
        content: "postgres configuration"
        description: "This volume must contain a config file named postgresql.conf! A template is 
          provided. Documenatation on its usage can be found here: 
          https://www.postgresql.org/docs/current/config-setting.html"
        optional: true

      - volume: /veld/input/initdb/
        file_type: "sql"
        content: "sql startup scripts"
        description: "any sql scripts in this folder will be executed if the database is 
          intialized."
        optional: true

    storage:
      - volume: /veld/storage/
        file_type: "postgresql database"

    networks:
      - veld_postgres

    config:
      - environemnt_var: "POSTGRES_USER"
        var_type: "str"
        default: "postgres_user"
        optional: true
      - environemnt_var: "POSTGRES_PASSWORD"
        var_type: "str"
        default: "postgres_password"
        optional: true
      - environemnt_var: "POSTGRES_DB"
        var_type: "str"
        default: "postgres_db"
        optional: true

services:
  veld_embeddings_platform_run_server:
    build: .
    command: bash -c "postgres -c config_file=/veld/input/config/postgresql.conf"
    volumes:
      - ./data/storage/postgres/db/:/veld/storage/postgres/db/
      - ./data/input/config/postgresql.conf:/veld/input/config/postgresql.conf
      - ./data/input/initdb/:/veld/input/initdb/
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: "postgres_user"
      POSTGRES_PASSWORD: "postgres_password"
      POSTGRES_DB: "postgres_db"
    networks:
      - postgres_network

networks:
  postgres_network:
    driver: bridge

